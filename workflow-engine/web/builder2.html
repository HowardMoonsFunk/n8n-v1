<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Workflow Builder</title>
    <!-- Tailwind for quick styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM UMD (local, vendored) -->
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <!-- React Flow CSS and UMD (local, vendored) -->
    <link rel="stylesheet" href="/vendor/reactflow-style.css" />
    <script src="/vendor/reactflow.umd.js"></script>
    <!-- Babel to transpile JSX in-browser (local, vendored) -->
    <script src="/vendor/babel.min.js"></script>
    <style>
      body {
        background: #f9fafb;
      }
      .card {
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      }
      .fade-in {
        animation: fadeInUp 0.6s ease forwards;
        opacity: 0;
        transform: translateY(20px);
      }
      @keyframes fadeInUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="min-h-screen">
    <pre
      id="debug"
      style="
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 9999;
        background: #111;
        color: #0f0;
        padding: 8px 10px;
        border-radius: 6px;
        max-width: 50vw;
        max-height: 30vh;
        overflow: auto;
        font: 12px/1.3 monospace;
        opacity: 0.9;
        display: none;
      "
    ></pre>
    <div id="root"></div>

    <script type="text/babel" data-presets="react,env">
      const $logBox = document.getElementById('debug');
      const log = (m) => {
        if ($logBox) {
          $logBox.style.display = 'block';
          $logBox.textContent += m + '\n';
        }
        console.log(m);
      };
      log('[builder2] Babel preset react/env active');
      const { useCallback } = React;
      const RF = window.ReactFlow || window.reactFlow || {};
      if (!window.React) log('[builder2] React missing');
      else log('[builder2] React OK');
      if (!window.ReactDOM) log('[builder2] ReactDOM missing');
      else log('[builder2] ReactDOM OK');
      // Support different UMD export shapes
      const ReactFlowComponent =
        RF.default || RF.ReactFlow || RF.ReactFlowProvider || RF.ReactFlowDefault || null;
      const Background = RF.Background;
      const Controls = RF.Controls;
      const addEdge = RF.addEdge;
      const useNodesState = RF.useNodesState;
      const useEdgesState = RF.useEdgesState;
      if (!ReactFlowComponent || !useNodesState || !useEdgesState) {
        log('[builder2] ReactFlow UMD missing or incomplete');
      } else {
        log('[builder2] ReactFlow OK');
      }

      function Button({ children, variant = 'primary', ...props }) {
        const base = 'px-4 py-2 rounded font-medium';
        const styles =
          variant === 'outline'
            ? 'border border-gray-300 text-gray-700 bg-white hover:bg-gray-50'
            : 'bg-indigo-600 text-white hover:bg-indigo-500';
        return (
          <button className={`${base} ${styles}`} {...props}>
            {children}
          </button>
        );
      }

      function Card({ children, className = '' }) {
        return <div className={`bg-white rounded-xl card ${className}`}>{children}</div>;
      }
      function CardHeader({ children, className = '' }) {
        return <div className={`p-4 ${className}`}>{children}</div>;
      }
      function CardTitle({ children, className = '' }) {
        return <h2 className={`text-xl font-semibold ${className}`}>{children}</h2>;
      }
      function CardContent({ children, className = '' }) {
        return <div className={`p-6 ${className}`}>{children}</div>;
      }

      function WorkflowBuilder() {
        // Fallback UI if React Flow failed to load
        if (!ReactFlowComponent || !useNodesState || !useEdgesState) {
          return (
            <div className="p-6">
              <div className="max-w-2xl mx-auto bg-yellow-50 border border-yellow-200 rounded-lg p-4">
                <div className="font-semibold text-yellow-800 mb-1">React Flow failed to load</div>
                <div className="text-sm text-yellow-700">
                  The React Flow UMD bundle could not be detected. This page requires network access
                  to cdn.jsdelivr.net or unpkg.com. If you’re offline or behind a firewall, try
                  connecting/whitelisting the CDN and hard refresh.
                </div>
              </div>
            </div>
          );
        }
        const initialNodes = [
          { id: '1', type: 'input', data: { label: 'Start Node' }, position: { x: 250, y: 50 } },
          { id: '2', data: { label: 'Condition: value > 10' }, position: { x: 250, y: 150 } },
          { id: '3', data: { label: '✅ Success Path' }, position: { x: 100, y: 300 } },
          { id: '4', data: { label: '❌ Failure Path' }, position: { x: 400, y: 300 } },
        ];

        const initialEdges = [
          { id: 'e1-2', source: '1', target: '2' },
          { id: 'e2-3', source: '2', target: '3', label: 'true' },
          { id: 'e2-4', source: '2', target: '4', label: 'false' },
        ];

        const [nodes, setNodes, onNodesChange] = useNodesState(initialNodes);
        const [edges, setEdges, onEdgesChange] = useEdgesState(initialEdges);

        const onConnect = useCallback(
          (params) => setEdges((eds) => addEdge({ ...params, animated: true }, eds)),
          [setEdges]
        );

        async function execute() {
          alert('Executing workflow... (wire to /api/execute next)');
        }
        async function save() {
          alert('Saving workflow... (wire to /api/workflows next)');
        }

        return (
          <div className="flex flex-col items-center p-6 bg-gray-50 min-h-screen">
            <div className="w-full max-w-5xl fade-in">
              <Card className="border-none">
                <CardHeader className="bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-t-xl">
                  <CardTitle className="text-2xl font-bold">⚙️ Visual Workflow Builder</CardTitle>
                </CardHeader>
                <CardContent className="bg-white rounded-b-xl">
                  <div className="h-[500px] border rounded-lg">
                    <ReactFlowComponent
                      nodes={nodes}
                      edges={edges}
                      onNodesChange={onNodesChange}
                      onEdgesChange={onEdgesChange}
                      onConnect={onConnect}
                      fitView
                    >
                      <Background color="#aaa" gap={16} />
                      <Controls />
                    </ReactFlowComponent>
                  </div>

                  <div className="mt-6 flex gap-4 justify-center">
                    <Button onClick={execute}>▶️ Execute</Button>
                    <Button variant="outline" onClick={save}>
                      💾 Save
                    </Button>
                  </div>
                </CardContent>
              </Card>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">
                <Card className="p-4">
                  <CardTitle>📋 Node Library</CardTitle>
                  <p className="text-gray-500 mt-2 text-sm">Drag nodes to canvas (coming soon)</p>
                  <div className="flex flex-wrap gap-2 mt-4">
                    <Button variant="outline">Action Node</Button>
                    <Button variant="outline">Condition Node</Button>
                    <Button variant="outline">HTTP Node</Button>
                    <Button variant="outline">Delay Node</Button>
                  </div>
                </Card>

                <Card className="p-4">
                  <CardTitle>🧩 Node Details</CardTitle>
                  <p className="text-gray-500 mt-2 text-sm">
                    Select a node to edit its configuration
                  </p>
                  <textarea
                    className="w-full h-40 mt-4 border rounded-lg p-2 text-sm font-mono"
                    placeholder="Node configuration JSON will appear here..."
                  ></textarea>
                </Card>
              </div>
            </div>
          </div>
        );
      }

      try {
        const mount = document.getElementById('root');
        if (!mount) {
          console.error('[builder2] Root mount not found');
          log('[builder2] ERROR: #root not found');
        } else {
          mount.innerHTML = '<div class="text-gray-500">Initializing Workflow Builder…</div>';
          const root = ReactDOM.createRoot(mount);
          root.render(<WorkflowBuilder />);
          log('[builder2] Rendered WorkflowBuilder');
        }
      } catch (err) {
        console.error('[builder2] Render error', err);
        log('[builder2] Render error: ' + (err && err.message ? err.message : err));
      }
    </script>
  </body>
</html>
